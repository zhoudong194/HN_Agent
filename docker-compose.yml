# ================================================================
# docker-compose.yml - HN_Agent cross-platform local deployment
#
# Works on x86_64 and ARM64 as long as Docker supports the host arch.
#
# Start:
#   docker compose up --build
#
# Web:
#   http://localhost:8000
#
# PostgreSQL from host tools:
#   host=localhost port=5433 db=ragdb user=raguser password=ragpass
# ================================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hn_agent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ragdb}
      POSTGRES_USER: ${DB_USER:-raguser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ragpass}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: hn-agent-rag:local
    container_name: hn_agent_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: "8000"

      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-ragdb}
      DB_USER: ${DB_USER:-raguser}
      DB_PASSWORD: ${DB_PASSWORD:-ragpass}
      DB_WAIT_TIMEOUT: "120"

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen-plus}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1024}

      EMBED_MODEL_NAME: ${EMBED_MODEL_NAME:-BAAI/bge-large-zh-v1.5}
      EMBED_DIM: "1024"
      HF_TOKEN: ${HF_TOKEN:-}

      TOP_K: ${TOP_K:-5}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.0}
      DATA_DIR: /app/data

      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-8}

      # Set AUTO_INGEST=1 to ingest files mounted in ./data on container start.
      AUTO_INGEST: ${AUTO_INGEST:-0}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - hf_cache:/app/.cache/huggingface
      - st_cache:/app/.cache/sentence-transformers

volumes:
  postgres_data:
  hf_cache:
  st_cache:
